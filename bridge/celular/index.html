const GELO = [0.3, 0.26, 0.31, 0.27, 0.32, 0.28, 0.3, 0.25, 0.31, 0.27, 0.3, 0.26];
const MARES_MUN = [
  [[30, 0.5], [60, 0.35], [90, 0.5], [80, 0.75], [45, 0.8], [25, 0.65]],
  [[200, 0.45], [230, 0.3], [260, 0.45], [250, 0.7], [220, 0.75], [195, 0.62]],
];
const CRATERAS_MUN = [[120, 0.8, 0.09], [160, 0.55, 0.06], [20, 0.25, 0.07], [290, 0.7, 0.08], [330, 0.4, 0.05], [70, 0.15, 0.04]];
const PLANOS_MINMUS = [[50, 0.6, 0.18], [170, 0.5, 0.15], [270, 0.65, 0.17], [330, 0.25, 0.12]];
const BRACOS = [[-15, -12, -10, -20], [-10, -12, -15, -20], [-15, -26, -10, -34], [-10, -26, -15, -34], [-15, -40, -10, -48], [-10, -40, -15, -48]];
const ESTRELAS = [[30, 86], [70, 140], [120, 78], [200, 96], [250, 76], [290, 130], [310, 90], [15, 170], [180, 150], [95, 110], [230, 176], [60, 100]];

// Navball: os mesmos valores de bridge/navball.py.
const CEU = [40, 105, 200], CHAO = [150, 70, 25];
const LINHA_CEU = [150, 195, 250], LINHA_CHAO = [250, 150, 60], HORIZONTE = [255, 255, 255];
const PASSO_PITCH = 10, MEIA_LARGURA_PITCH = 0.5, MEIA_LARGURA_HORIZONTE = 1.2;
const RUMOS_MERIDIANOS = [0, 30, 60, 90, 120, 150];
const MEIA_LARGURA_MERIDIANO = 0.01, LATITUDE_MAX_MERIDIANO = 80, SOMBRA = 0.45;

// Números pintados na navball: o rumo a cada 30°, logo acima do horizonte,
// com letras nos pontos cardeais (L = leste, O = oeste); o pitch a cada 30°,
// um pouco ao lado dos meridianos de N, L, S e O.
const CARDEAIS = { 0: "N", 90: "L", 180: "S", 270: "O" };
const NUMEROS_RUMO = [];
for (let h = 0; h < 360; h += 30) NUMEROS_RUMO.push([CARDEAIS[h] || String(h), 4, h]);
const NUMEROS_PITCH = [];
for (const h of [0, 90, 180, 270]) for (const p of [60, 30, -30, -60]) NUMEROS_PITCH.push([String(p), p, h + 6]);
const VISIVEL_MIN = 0.3;          // perto da borda da bola o número ficaria amassado
const RAD = Math.PI / 180, GRAUS = 180 / Math.PI;

// ---------- o que a tela sabe, só a partir das mensagens ----------

const MARCADORES_DO_MODO = ["PRO", "NRM", "RDL"];
const NUMEROS_DO_MODO = ["VEL", "AP", "PE", "TAP", "TPE", "DIST"];
const NUMEROS_OFF = ["AP", "PE", "TAP", "TPE", "DIST"];

const estado = {
  atitude: null,                  // [pitch, rumo, rolagem] em graus
  marcadores: { PRO: null, NRM: null, RDL: null, TGT: null, MNV: null, FBW: null },  // [pitch, rumo]
  altitude: null,                 // ["ALT" ou "RAD", metros]
  numeros: { VEL: null, AP: null, PE: null, TAP: null, TPE: null, DIST: null, VV: null, ACEL: null },
  estados: { SAS: null, RCS: null, MODO: null },
  pagina: "NAV",
  sas: { modo: null, cor: null, erro: null },          // modo do SAS no jogo, "A"/"V", décimos de grau
  ap: { HDG: [0, null], ALT: [0, null], VS: [0, null] },  // [estado, valor]
  cursor: ["HDG", false],                              // [linha, escolhida]
  lei: "OFF", trava: null,
  estol: false,                                        // alpha floor do fly by wire: toca o alarme
  scr: ["OFF", null],                                  // korry POUSO: [estado, segundos que faltam segurando]
  pouso: pousoVazio(),                                 // o que o scripts/pouso.py manda (POU)
  lancar: ["OFF", null],
  subida: subidaVazia(),
  menuSubida: { ALT: null, INC: null, PLANO: null },
  cursorSubida: ["ALT", false],
  ultimaValida: -Infinity,
  toque: [null, -Infinity],
};

const cena = { modo: null, antes: null, desde: 0, chao: null };

const SUAVE = { campos: ["ALT", "ANOM", "AP", "PE"], janela: 400, guarda: 1500, maximo: 500, correcao: 150 };
let suave = {};

function valorSuave(campo, agora) {
  const s = suave[campo];
  if (!s) return null;
  const dt = limitar(agora - s.t, 0, SUAVE.maximo);
  const k = Math.max(0, 1 - Math.max(0, agora - s.t) / SUAVE.correcao);
  return s.v + s.taxa * dt + s.desvio * k;
}

function registrarSuave(campo, valor, agora) {
  if (!SUAVE.campos.includes(campo)) return;
  if (valor === null) {
    delete suave[campo];
    return;
  }
  const s = suave[campo];
  if (!s) {
    suave[campo] = { amostras: [[agora, valor]], bruto: valor, v: valor, t: agora, taxa: 0, desvio: 0 };
    return;
  }
  const antes = valorSuave(campo, agora);
  let passo = valor - s.bruto;
  if (campo === "ANOM") passo = ((passo % 3600) + 5400) % 3600 - 1800;
  const v = s.v + passo;
  s.amostras.push([agora, v]);
  while (s.amostras.length > 1 && agora - s.amostras[0][0] > SUAVE.guarda) s.amostras.shift();
  let ref = null;
  for (const amostra of s.amostras) if (agora - amostra[0] >= SUAVE.janela) ref = amostra;
  s.taxa = ref ? (v - ref[1]) / (agora - ref[0]) : 0;
  s.bruto = valor;
  s.v = v;
  s.t = agora;
  s.desvio = antes - v;
}

function inteiro(texto) {
  return /^[+-]?[0-9]+$/.test(texto) ? parseInt(texto, 10) : null;
}

function linhaDaSubida(nome, partes, numeros) {
  if (nome === "SUB") {
    if (partes.length === 1 && partes[0] === "OFF") {
      estado.subida = subidaVazia();
      cena.modo = cena.chao = null;
      suave = {};
      return true;
    }
    if (partes.length !== 2) return false;
    const [campo, valor] = partes;
    if (CAMPOS_SUBIDA_TEXTO.includes(campo)) {
      estado.subida[campo] = valor === "OFF" ? null : valor;
      return true;
    }
    if (!CAMPOS_SUBIDA.includes(campo) || (numeros[1] === null && valor !== "OFF")) return false;
    estado.subida[campo] = numeros[1];
    registrarSuave(campo, numeros[1], performance.now());
    return true;
  }
  if (nome === "SBV" && partes.length === 2 && LINHAS_MENU_SUBIDA.includes(partes[0]) && numeros[1] !== null) {
    estado.menuSubida[partes[0]] = numeros[1];
    return true;
  }
  if (nome === "SBC" && partes.length === 2 && LINHAS_MENU_SUBIDA.includes(partes[0]) && ["0", "1"].includes(partes[1])) {
    estado.cursorSubida = [partes[0], partes[1] === "1"];
    return true;
  }
  return false;
}

function interpretar(mensagem) {
  const espaco = mensagem.indexOf(" ");
  const nome = espaco < 0 ? mensagem : mensagem.slice(0, espaco);
  const partes = espaco < 0 ? [] : mensagem.slice(espaco + 1).split(" ");
  const numeros = partes.map(inteiro);
  const tudoNumero = numeros.length > 0 && numeros.every((n) => n !== null);
  const off = partes.length === 1 && partes[0] === "OFF";
  const n = estado.numeros;

  if (nome === "ATT" && partes.length === 3 && tudoNumero) {
    estado.atitude = numeros.map((v) => v / 10);
  } else if (nome in estado.marcadores && off) {
    estado.marcadores[nome] = null;
  } else if (nome in estado.marcadores && partes.length === 2 && tudoNumero) {
    estado.marcadores[nome] = numeros.map((v) => v / 10);
  } else if ((nome === "ALT" || nome === "RAD") && partes.length === 1 && tudoNumero) {
    estado.altitude = [nome, numeros[0]];
  } else if (NUMEROS_OFF.includes(nome) && off) {
    n[nome] = null;
  } else if (nome in n && partes.length === 1 && tudoNumero) {
    n[nome] = numeros[0];
  } else if ((nome === "SAS" || nome === "RCS") && partes.length === 1 && (partes[0] === "0" || partes[0] === "1")) {
    estado.estados[nome] = partes[0] === "1";
  } else if (nome === "PAG" && partes.length === 1 && ["NAV", "SAS", "AP", "POUSO", "SUBIDA"].includes(partes[0])) {
    estado.pagina = partes[0];
  } else if (nome === "SASM" && off) {
    estado.sas.modo = estado.sas.cor = null;
  } else if (nome === "SASM" && partes.length === 2 && ["A", "V"].includes(partes[1])) {
    [estado.sas.modo, estado.sas.cor] = partes;
  } else if (nome === "SASE" && (off || (partes.length === 1 && tudoNumero))) {
    estado.sas.erro = off ? null : numeros[0];
  } else if (nome === "APL" && partes.length === 2 && partes[0] in estado.ap && ["0", "1", "2"].includes(partes[1])) {
    estado.ap[partes[0]][0] = numeros[1];
  } else if (nome === "APV" && partes.length === 2 && partes[0] in estado.ap && numeros[1] !== null) {
    estado.ap[partes[0]][1] = numeros[1];
  } else if (nome === "APC" && partes.length === 2 && partes[0] in estado.ap && ["0", "1"].includes(partes[1])) {
    estado.cursor = [partes[0], partes[1] === "1"];
  } else if (nome === "SCR" && partes.length === 2 && SCRIPTS.includes(partes[0]) && ["OFF", "ATIVO", "FIM", "ABORT", "FALHA"].includes(partes[1])) {
    estado[partes[0] === "POUSO" ? "scr" : "lancar"] = [partes[1], null];
  } else if (nome === "SCR" && partes.length === 3 && SCRIPTS.includes(partes[0]) && ["LIGA", "DESL"].includes(partes[1]) && numeros[2] !== null) {
    estado[partes[0] === "POUSO" ? "scr" : "lancar"] = [partes[1], numeros[2]];
  } else if (linhaDaSubida(nome, partes, numeros)) {
    return true;
  } else if (nome === "POU" && off) {
    estado.pouso = pousoVazio();
  } else if (nome === "POU" && partes.length === 2 && CAMPOS_POUSO_TEXTO.includes(partes[0])) {
    estado.pouso[partes[0]] = partes[1];
  } else if (nome === "POU" && partes.length === 2 && CAMPOS_POUSO.includes(partes[0]) && (numeros[1] !== null || partes[1] === "OFF")) {
    estado.pouso[partes[0]] = numeros[1];
  } else if (nome === "LEI" && partes.length === 1 && ["FBW", "DIRETA", "CHAO", "OFF"].includes(partes[0])) {
    estado.lei = partes[0];
  } else if (nome === "ESTOL" && partes.length === 1 && ["0", "1"].includes(partes[0])) {
    estado.estol = partes[0] === "1";
  } else if (nome === "TRAVA" && (off || (partes.length === 1 && tudoNumero))) {
    estado.trava = off ? null : numeros[0];
  } else if (nome === "MODO" && partes.length === 1 && ["SUP", "ORB", "ALVO"].includes(partes[0])) {
    if (partes[0] !== estado.estados.MODO) {
      // Os números e os marcadores do modo antigo não valem mais.
      for (const k of NUMEROS_DO_MODO) n[k] = null;
      for (const k of MARCADORES_DO_MODO) estado.marcadores[k] = null;
    }
    estado.estados.MODO = partes[0];
  } else {
    return false;
  }
  return true;
}

// ---------- comunicação com a ponte ----------

// Uma linha de cada vez, na ordem, como numa serial. Pedidos soltos podem
// chegar trocados: o navegador manda vários ao mesmo tempo.
let envios = Promise.resolve();
function mandar(linha) {
  envios = envios
    .then(() => fetch("/linha", { method: "POST", body: linha }))
    .catch(() => {});
}

// Como a placa ao ligar: a ponte reenvia tudo. Vale também quando a conexão
// cai e volta sozinha.
let eventos = null;
let conectouEm = -Infinity;
function conectar() {
  if (eventos) eventos.close();
  conectouEm = performance.now();
  eventos = new EventSource("/eventos");
  eventos.onopen = () => mandar("READY");
  eventos.onmessage = (e) => {
    const linha = e.data;
    if (linha.length > MAX_LINHA) return;
    if (interpretar(linha)) estado.ultimaValida = performance.now();
    else mandar("ERR " + linha);
  };
}
conectar();
setInterval(() => {
  const agora = performance.now();
  if (agora - estado.ultimaValida > RECONECTAR && agora - conectouEm > RECONECTAR) conectar();
}, 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && performance.now() - estado.ultimaValida > SEM_SINAL) conectar();
});

// ---------- navball ----------

function direcao(pitch, rumo) {
  const p = pitch * RAD, r = rumo * RAD;
  return [Math.cos(p) * Math.cos(r), Math.cos(p) * Math.sin(r), Math.sin(p)];
}

function baseDaNave(pitch, rumo, rolagem) {
  const p = pitch * RAD, r = rumo * RAD, o = rolagem * RAD;
  const sp = Math.sin(p), cp = Math.cos(p), sr = Math.sin(r), cr = Math.cos(r);
  const so = Math.sin(o), co = Math.cos(o);
  const frente = [cp * cr, cp * sr, sp];
  const direita0 = [-sr, cr, 0];
  const cima0 = [-sp * cr, -sp * sr, cp];
  const direita = direita0.map((d, i) => co * d - so * cima0[i]);
  const cima = direita0.map((d, i) => so * d + co * cima0[i]);
  return [frente, direita, cima];
}

function projetar(base, v) {
  const [frente, direita, cima] = base;
  const dot = (a) => a[0] * v[0] + a[1] * v[1] + a[2] * v[2];
  return [dot(direita), dot(cima), dot(frente)];
}

let bola = null;   // a imagem da bola e as coordenadas de cada ponto dela

function prepararBola(pontos) {
  const n = Math.max(64, Math.min(MAX_PONTOS_BOLA, pontos));
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = n;
  const x = new Float32Array(n * n), y = new Float32Array(n * n), z = new Float32Array(n * n);
  const dentro = new Uint8Array(n * n);
  const meio = (n - 1) / 2;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const k = i * n + j;
      const xx = (j - meio) / meio, yy = -(i - meio) / meio;
      const r2 = xx * xx + yy * yy;
      x[k] = xx; y[k] = yy; z[k] = Math.sqrt(Math.max(0, 1 - r2));
      dentro[k] = r2 <= 1 ? 1 : 0;
    }
  }
  const contexto = canvas.getContext("2d");
  bola = { n, canvas, contexto, imagem: contexto.createImageData(n, n), x, y, z, dentro, atitude: null };
}

function desenharBola(base) {
  const { n, imagem, x, y, z, dentro } = bola;
  const d = imagem.data;
  const [f, dir, c] = base;
  const normais = RUMOS_MERIDIANOS.map((h) => [-Math.sin(h * RAD), Math.cos(h * RAD)]);
  for (let k = 0; k < n * n; k++) {
    const o = k * 4;
    if (!dentro[k]) { d[o + 3] = 0; continue; }
    const xx = x[k], yy = y[k], zz = z[k];
    const norte = xx * dir[0] + yy * c[0] + zz * f[0];
    const leste = xx * dir[1] + yy * c[1] + zz * f[1];
    const vertical = xx * dir[2] + yy * c[2] + zz * f[2];
    const ceu = vertical >= 0;
    const latitude = Math.asin(Math.max(-1, Math.min(1, vertical))) * GRAUS;
    let cor = ceu ? CEU : CHAO;
    if (Math.abs(latitude) < MEIA_LARGURA_HORIZONTE) {
      cor = HORIZONTE;
    } else {
      let linha = Math.abs(latitude - PASSO_PITCH * Math.round(latitude / PASSO_PITCH)) < MEIA_LARGURA_PITCH;
      if (!linha && Math.abs(latitude) <= LATITUDE_MAX_MERIDIANO) {
        for (const [nn, nl] of normais) {
          if (Math.abs(nn * norte + nl * leste) < MEIA_LARGURA_MERIDIANO) { linha = true; break; }
        }
      }
      if (linha) cor = ceu ? LINHA_CEU : LINHA_CHAO;
    }
    const sombra = 1 - SOMBRA + SOMBRA * zz;
    d[o] = cor[0] * sombra; d[o + 1] = cor[1] * sombra; d[o + 2] = cor[2] * sombra; d[o + 3] = 255;
  }
  bola.contexto.putImageData(imagem, 0, 0);
}

// ---------- desenho: primitivas em unidades da placa ----------

const canvas = document.getElementById("tela");
const ctx = canvas.getContext("2d");
let escala = 1, deslocX = 0, deslocY = 0, dpr = 1;

function fonte(tamanho) {
  return `${tamanho}px "DejaVu Sans Mono", Menlo, Consolas, "Roboto Mono", monospace`;
}

function texto(t, cor, x, y, alinhamento = "left", linhaBase = "top", tamanho = 14) {
  ctx.font = fonte(tamanho);
  ctx.fillStyle = cor;
  ctx.textAlign = alinhamento;
  ctx.textBaseline = linhaBase;
  ctx.fillText(t, x, y);
}

function textoCentro(t, cor, x, y, tamanho = 14) {
  texto(t, cor, x, y, "center", "middle", tamanho);
}

function circulo(x, y, r, preenchimento, contorno, largura = 1) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, 2 * Math.PI);
  if (preenchimento) { ctx.fillStyle = preenchimento; ctx.fill(); }
  if (contorno) { ctx.strokeStyle = contorno; ctx.lineWidth = largura; ctx.stroke(); }
}

function linha(cor, largura, ...pontos) {
  ctx.beginPath();
  ctx.moveTo(pontos[0][0], pontos[0][1]);
  for (const [px, py] of pontos.slice(1)) ctx.lineTo(px, py);
  ctx.strokeStyle = cor;
  ctx.lineWidth = largura;
  ctx.stroke();
}

function retangulo(r, preenchimento, contorno, largura = 1, raio = 0) {
  ctx.beginPath();
  if (raio > 0) {
    const { x, y, w, h } = r;
    ctx.moveTo(x + raio, y);
    ctx.arcTo(x + w, y, x + w, y + h, raio);
    ctx.arcTo(x + w, y + h, x, y + h, raio);
    ctx.arcTo(x, y + h, x, y, raio);
    ctx.arcTo(x, y, x + w, y, raio);
    ctx.closePath();
  } else {
    ctx.rect(r.x, r.y, r.w, r.h);
  }
  if (preenchimento) { ctx.fillStyle = preenchimento; ctx.fill(); }
  if (contorno) { ctx.strokeStyle = contorno; ctx.lineWidth = largura; ctx.stroke(); }
}

function naBola(x, y) {
  return [BOLA.x + x * BOLA.r, BOLA.y - y * BOLA.r];
}

// ---------- formatação, igual ao simulador ----------

function formatarDistancia(m) {
  if (m === null) return "---";
  const a = Math.abs(m);
  if (a < 100000) return `${m} m`;
  if (a < 10000000) return `${(m / 1000).toFixed(1)} km`;
  if (a < 1000000000) return `${(m / 1000).toFixed(0)} km`;
  return `${(m / 1000000).toFixed(0)} Mm`;
}

function formatarVelocidade(decimos) {
  if (decimos === null) return "---";
  const sinal = decimos < 0 ? "-" : "";
  const d = Math.abs(decimos);
  if (d < 10000) return `${sinal}${Math.floor(d / 10)}.${d % 10} m/s`;
  return `${sinal}${Math.floor(d / 10)} m/s`;
}

function formatarTempo(s) {
  if (s === null) return "T- ---";
  const horas = Math.floor(s / 3600), resto = s % 3600;
  if (horas >= 100) return `T-${horas}h`;
  const dois = (v) => String(v).padStart(2, "0");
  return `T-${dois(horas)}:${dois(Math.floor(resto / 60))}:${dois(resto % 60)}`;
}

// ---------- desenho: as partes da tela ----------

function desenharAro() {
  circulo(BOLA.x, BOLA.y, ARO_RAIO, COR.aro, COR.borda, 1);
}

function circuloComHastes([cx, cy], cor, angulos, de, ate) {
  circulo(cx, cy, 6, null, cor, 2);
  for (const a of angulos) {
    const dx = Math.cos(a * RAD), dy = -Math.sin(a * RAD);
    linha(cor, 2, [cx + de * dx, cy + de * dy], [cx + ate * dx, cy + ate * dy]);
  }
}

function ponto([cx, cy], cor, r = 1) { circulo(cx, cy, r, cor, null); }

function triangulo([cx, cy], cor, paraCima) {
  const s = paraCima ? -1 : 1;
  const pontos = [[cx, cy + 7 * s], [cx - 7, cy - 5 * s], [cx + 7, cy - 5 * s]];
  ctx.beginPath();
  ctx.moveTo(...pontos[0]); ctx.lineTo(...pontos[1]); ctx.lineTo(...pontos[2]);
  ctx.closePath();
  ctx.strokeStyle = cor; ctx.lineWidth = 2; ctx.stroke();
  return pontos;
}

const DESENHO_MARCADOR = {
  progrado: (c) => { circuloComHastes(c, COR.pro, [0, 90, 180], 6, 11); ponto(c, COR.pro); },
  retrogrado: (c) => {
    circuloComHastes(c, COR.pro, [45, 135, 225, 315], 1, 5);
    circuloComHastes(c, COR.pro, [90, 225, 315], 6, 11);
  },
  normal: (c) => { triangulo(c, COR.nrm, true); ponto(c, COR.nrm); },
  antinormal: (c) => { for (const p of triangulo(c, COR.nrm, false)) linha(COR.nrm, 1, c, p); },
  radialFora: (c) => { circuloComHastes(c, COR.rdl, [45, 135, 225, 315], 6, 11); ponto(c, COR.rdl); },
  radialDentro: (c) => circuloComHastes(c, COR.rdl, [45, 135, 225, 315], 2, 6),
  alvo: (c) => { circuloComHastes(c, COR.tgt, [0, 90, 180, 270], 6, 11); ponto(c, COR.tgt); },
  antialvo: (c) => circuloComHastes(c, COR.tgt, [45, 135, 225, 315], 1, 5),
  manobra: (c) => { circuloComHastes(c, COR.mnv, [90, 210, 330], 6, 11); ponto(c, COR.mnv, 3); },
  // Quatro cantos de um quadrado: com o avião no ponto, o pró-grado fica
  // dentro dele, e as hastes do pró-grado passam pelos vãos.
  fbw: ([cx, cy]) => {
    for (const sx of [-1, 1]) {
      for (const sy of [-1, 1]) {
        const canto = [cx + 8 * sx, cy + 8 * sy];
        linha(COR.fbw, 2, [cx + 4 * sx, cy + 8 * sy], canto, [cx + 8 * sx, cy + 4 * sy]);
      }
    }
    ponto([cx, cy], COR.fbw);
  },
};

// A ordem é a de desenho: o último fica por cima.
const PARES = [
  ["RDL", "radialFora", "radialDentro"],
  ["NRM", "normal", "antinormal"],
  ["TGT", "alvo", "antialvo"],
  ["FBW", "fbw", null],             // antes do pró-grado, que fica por cima quando os dois se alinham
  ["PRO", "progrado", "retrogrado"],
  ["MNV", "manobra", null],
];

function desenharNavball(comSinal) {
  if (!comSinal || !estado.atitude) {
    circulo(BOLA.x, BOLA.y, BOLA.r, COR.botaoApagado, null);
    textoCentro("SEM SINAL", COR.aviso, BOLA.x, BOLA.y - 20);
    return;
  }

  const [pitch, rumo, rolagem] = estado.atitude;
  const base = baseDaNave(pitch, rumo, rolagem);
  if (bola.atitude !== estado.atitude) {   // só refaz a bola quando a atitude muda
    desenharBola(base);
    bola.atitude = estado.atitude;
  }
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(bola.canvas, BOLA.x - BOLA.r, BOLA.y - BOLA.r, 2 * BOLA.r, 2 * BOLA.r);

  // Os números ficam sempre de pé, sem girar com a bola, com uma sombra
  // escura que os separa da grade.
  for (const [numeros, cor] of [[NUMEROS_PITCH, COR.numeroPitch], [NUMEROS_RUMO, COR.numeroRumo]]) {
    for (const [t, p, h] of numeros) {
      const [x, y, z] = projetar(base, direcao(p, h));
      if (z <= VISIVEL_MIN) continue;
      const [cx, cy] = naBola(x, y);
      textoCentro(t, COR.sombraNumero, cx + 0.6, cy + 0.6, 11);
      textoCentro(t, cor, cx, cy, 11);
    }
  }

  for (const [nome, desenho, oposto] of PARES) {
    const m = estado.marcadores[nome];
    if (!m) continue;
    const [p, r] = m;
    const direcoes = [[direcao(p, r), desenho]];
    if (oposto) direcoes.push([direcao(-p, r + 180), oposto]);
    for (const [vetor, qual] of direcoes) {
      const [x, y, z] = projetar(base, vetor);
      if (z > 0) DESENHO_MARCADOR[qual](naBola(x, y));
    }
  }

  // O "W" laranja no centro: para onde o nariz aponta.
  const cx = BOLA.x, cy = BOLA.y;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  linha(COR.nave, 3, [cx - 24, cy], [cx - 9, cy]);
  linha(COR.nave, 3, [cx + 9, cy], [cx + 24, cy]);
  linha(COR.nave, 3, [cx - 9, cy], [cx, cy + 7], [cx + 9, cy]);
  ponto([cx, cy - 3], COR.nave, 2);
  ctx.lineCap = "butt";
  ctx.lineJoin = "miter";
}

function caixa(r, cor, titulo, valor, destacada) {
  retangulo(r, COR.fundo, cor, destacada ? 2 : 1, 4);
  texto(titulo, cor, r.x + 5, r.y + 3, "left", "top", 11);
  texto(valor, COR.texto, r.x + r.w - 5, r.y + 15, "right", "top", 14);
}

function desenharCaixas(comSinal, agora) {
  const [tocado, quando] = estado.toque;
  const modo = estado.estados.MODO || "---";
  const vel = comSinal ? formatarVelocidade(estado.numeros.VEL) : "---";
  caixa(CAIXA_VEL, COR.vel, `VEL ${modo}`, vel, tocado === "MODO" && agora - quando < DESTAQUE_TOQUE);

  const [tipo, altitude] = estado.altitude || ["ALT", null];
  caixa(CAIXA_ALT, COR.alt, tipo === "RAD" ? "RADAR" : "ALT", comSinal ? formatarDistancia(altitude) : "---", false);
}

function desenharBarras(comSinal) {
  const acel = comSinal ? estado.numeros.ACEL : null;
  const vv = comSinal ? estado.numeros.VV : null;

  // Acelerador: enche de baixo para cima.
  let b = BARRA_ACEL;
  retangulo(b, COR.aro, null);
  if (acel !== null) {
    const altura = b.h * Math.max(0, Math.min(100, acel)) / 100;
    retangulo({ x: b.x, y: b.y + b.h - altura, w: b.w, h: altura }, COR.acel, null);
  }
  retangulo(b, null, COR.borda, 1);
  texto("ACEL", COR.rotulo, 2, 4, "left", "top", 11);
  texto(acel === null ? "---" : `${acel}%`, COR.texto, 2, b.y + b.h + 4, "left", "top", 11);

  // Velocidade vertical: zero no meio, escala logarítmica.
  b = BARRA_VV;
  const meio = b.y + b.h / 2, metade = b.h / 2;
  const yDaVv = (mps) => {
    const fracao = Math.log10(1 + Math.min(Math.abs(mps), VV_MAX)) / Math.log10(1 + VV_MAX);
    return meio - Math.sign(mps) * fracao * metade;
  };
  retangulo(b, COR.aro, null);
  if (vv !== null) {
    const mps = vv / 10;
    const y = yDaVv(mps);
    const cor = mps >= 0 ? COR.vvSobe : mps > -10 ? COR.vvDesce : COR.vvDesceRapido;
    retangulo({ x: b.x, y: Math.min(y, meio), w: b.w, h: Math.abs(y - meio) + 1 }, cor, null);
  }
  retangulo(b, null, COR.borda, 1);
  linha(COR.texto, 1, [b.x - 3, meio], [b.x + b.w, meio]);
  for (const mps of [100, 10, -10, -100]) {
    const y = yDaVv(mps);
    linha(COR.traco, 1, [b.x - 3, y], [b.x, y]);
    texto(mps > 0 ? `+${mps}` : `${mps}`, COR.rotulo, b.x - 4, y, "right", "middle", 11);
  }
  texto("V VERT", COR.rotulo, LARGURA - 2, 4, "right", "top", 11);
}

function desenharBotoes(comSinal, agora) {
  const [tocado, quando] = estado.toque;
  for (const [nome, [cx, cy]] of Object.entries(BOTOES_REDONDOS)) {
    const ligado = comSinal && estado.estados[nome];
    const destaque = tocado === nome && agora - quando < DESTAQUE_TOQUE;
    const borda = destaque ? COR.texto : ligado ? COR.bordaLigado : COR.borda;
    circulo(cx, cy, RAIO_BOTAO, ligado ? COR.botaoLigado : COR.botaoApagado, borda, destaque ? 2 : 1);
    textoCentro(nome, COR.texto, cx, cy, 11);
  }
}

function desenharPainel(comSinal) {
  const n = estado.numeros;
  const modo = estado.estados.MODO;
  // No SUP o painel não aparece: a velocidade vertical já está na barra.
  let linhas = [];
  if (comSinal && modo === "ORB") {
    linhas = [
      ["AP", formatarDistancia(n.AP), formatarTempo(n.TAP)],
      ["PE", formatarDistancia(n.PE), formatarTempo(n.TPE)],
    ];
  } else if (comSinal && modo === "ALVO") {
    linhas = [["DIST", formatarDistancia(n.DIST), ""]];
  }
  if (linhas.length === 0) return;

  retangulo(PAINEL, null, COR.borda, 1, 4);
  let y = PAINEL.y + 3;
  for (const [rotulo, valor, tempo] of linhas) {
    texto(rotulo, COR.rotulo, PAINEL.x + 6, y + 3, "left", "top", 11);
    texto(valor, COR.texto, PAINEL.x + 128, y + 1, "right", "top", 14);
    if (tempo) texto(tempo, COR.rotulo, PAINEL.x + PAINEL.w - 5, y + 3, "right", "top", 11);
    y += 17;
  }
}

// ---------- páginas do painel de sistemas de controle ----------

function marcadorDoModo(modo, c) {
  const desenhos = {
    PRO: "progrado", RETRO: "retrogrado", NRM: "normal", ANRM: "antinormal",
    RFORA: "radialFora", RDENTRO: "radialDentro", ALVO: "alvo", AALVO: "antialvo", MAN: "manobra",
  };
  if (modo === "ESTAB") {   // segura a atitude de agora: não tem marcador na navball
    circulo(c[0], c[1], 7, null, COR.texto, 2);
    linha(COR.texto, 2, [c[0] - 4, c[1]], [c[0] + 4, c[1]]);
  } else {
    DESENHO_MARCADOR[desenhos[modo]](c);
  }
}

function disponivel(modo) {
  if (modo === "ALVO" || modo === "AALVO") return estado.marcadores.TGT !== null;
  if (modo === "MAN") return estado.marcadores.MNV !== null;
  return true;
}

function botaoDeModo(modo, c, r) {
  const escolhido = estado.sas.modo === modo;
  const cor = escolhido ? (estado.sas.cor === "V" ? COR.verde : COR.azul) : null;
  if (cor) circulo(c[0], c[1], r + 4, null, cor, 2);
  circulo(c[0], c[1], r, COR.fundoModo, cor || COR.borda, cor ? 3 : 1);
  if (disponivel(modo)) marcadorDoModo(modo, c);
  else textoCentro("--", COR.apagado, c[0], c[1], 11);
}

function desenharPaginaSas() {
  const s = estado.sas, ligado = estado.estados.SAS;
  texto("SAS", COR.rotulo, 8, 4, "left", "top", 11);
  texto(ligado ? "LIGADO" : "DESLIGADO", ligado ? COR.verde : COR.apagado, 8, 17, "left", "top", 14);
  texto("ERRO", COR.rotulo, 312, 4, "right", "top", 11);
  const erro = s.erro === null ? "---" : (s.erro / 10).toFixed(1);
  texto(erro, s.cor === "V" ? COR.verde : s.cor === "A" ? COR.azul : COR.apagado, 312, 17, "right", "top", 14);

  circulo(RODA.x, RODA.y, RODA.r, COR.aro, COR.borda, 1);
  const pos = {};
  for (const [modo, a] of Object.entries(MODOS_RODA)) {
    pos[modo] = [RODA.x + RODA.modos * Math.cos(a * RAD), RODA.y + RODA.modos * Math.sin(a * RAD)];
    linha(COR.borda, 1, [RODA.x, RODA.y], pos[modo]);
  }
  for (const [modo, c] of Object.entries(pos)) botaoDeModo(modo, c, RODA.botao);

  // A nave no centro aponta para o modo escolhido, torta enquanto ainda vira.
  if (ligado && s.modo in MODOS_RODA) {
    const torto = s.cor === "V" ? 0 : Math.min(60, (s.erro || 600) / 10);
    const a = (MODOS_RODA[s.modo] + torto) * RAD, cor = s.cor === "V" ? COR.verde : COR.azul;
    const ponta = [RODA.x + 22 * Math.cos(a), RODA.y + 22 * Math.sin(a)];
    const lado = (d) => [RODA.x + 9 * Math.cos(a + d), RODA.y + 9 * Math.sin(a + d)];
    linha(cor, 3, lado(-2.4), ponta, lado(2.4));
  }
  circulo(RODA.x, RODA.y, 3, COR.nave, null);

  MODOS_FAIXA.forEach((modo, i) => {
    const r = { x: FAIXA.x + i * FAIXA.passo, y: FAIXA.y, w: FAIXA.w, h: FAIXA.h };
    retangulo(r, COR.aro, COR.borda, 1, 4);
    botaoDeModo(modo, [r.x + r.w / 2, r.y + r.h / 2], 11);
  });
  textoCentro("MODO DO SAS", COR.rotulo, 160, 232, 11);
}

function valorAp(nome, valor) {
  if (valor === null) return "---";
  if (nome === "HDG") return String(valor).padStart(3, "0");
  if (nome === "ALT") return `${valor} M`;
  return `${valor >= 0 ? "+" : "-"}${(Math.abs(valor) / 10).toFixed(1)} M/S`;
}

function cursorDaLinha(y, escolhida) {
  linha(COR.texto, 1, [12, y - 6], [20, y], [12, y + 6]);
  if (!escolhida) retangulo({ x: 24, y: y - 17, w: 286, h: 34 }, null, COR.texto, 1, 4);
  else retangulo({ x: 176, y: y - 15, w: 130, h: 30 }, null, COR.ambar, 2, 3);
}

function desenharPaginaAp() {
  textoCentro("PILOTO AUTOMATICO", COR.rotulo, 160, 12, 14);
  linha(COR.borda, 1, [12, 24], [308, 24]);
  const [linhaCursor, escolhida] = estado.cursor;
  LINHAS_AP.forEach((nome, i) => {
    const y = 46 + i * 44;
    const [modo, valor] = estado.ap[nome];
    const [rotulo, cor] = ESTADO_AP[modo];
    if (nome === linhaCursor) cursorDaLinha(y, escolhida);
    texto(NOMES_AP[nome], COR.texto, 32, y, "left", "middle", 16);
    texto(rotulo, COR[cor], 80, y, "left", "middle", 11);
    texto(valorAp(nome, valor), nome === linhaCursor && escolhida ? COR.ambar : COR.texto, 300, y, "right", "middle", 20);
  });
  linha(COR.borda, 1, [12, 184], [308, 184]);
  const lei = { FBW: ["LEI FBW", COR.verde], DIRETA: ["LEI DIRETA", COR.ambar], CHAO: ["NO CHAO", COR.apagado], OFF: ["FBW FECHADO", COR.apagado] }[estado.lei];
  texto("FBW", COR.rotulo, 16, 200, "left", "middle", 11);
  texto(lei[0], lei[1], 48, 200, "left", "middle", 14);
  texto(estado.trava === null ? "SEM TRAVA" : `TRAVA ${estado.trava} M`, estado.trava === null ? COR.apagado : COR.verde, 304, 200, "right", "middle", 14);
  const dica = escolhida ? "GIRAR: VALOR  APERTAR: SAI" : "GIRAR: LINHA  APERTAR: ESCOLHE";
  textoCentro(dica, COR.rotulo, 160, 226, 11);
}

function caixaSegurar(scr, faltam, paraAbrir) {
  if (scr !== "LIGA" && scr !== "DESL") return;
  retangulo({ x: 90, y: 80, w: 140, h: 56 }, COR.fundo, COR.ambar, 2, 6);
  textoCentro(`SEGURE ${faltam} S`, COR.ambar, 160, 100, 20);
  textoCentro(scr === "LIGA" ? paraAbrir : "PARA ABORTAR", COR.ambar, 160, 122, 11);
}

function indicadorDeFase(fase, cor, fimDaLinha) {
  circulo(26, 212, 16, null, cor, 2);
  circulo(26, 212, 7, null, cor, 2);
  circulo(26, 212, 2, cor, null);
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) linha(cor, 2, [26 + 11 * dx, 212 + 11 * dy], [26 + 19 * dx, 212 + 19 * dy]);
  texto(fase, cor, 48, 203);
  linha(cor, 1, [46, 222.5], [fimDaLinha, 222.5]);
}

function naveDePouso(x, pe, motor, trem) {
  if (motor) {
    const comprimento = 6 + 22 * motor / 100;
    ctx.beginPath(); ctx.moveTo(x - 3, pe - 2); ctx.lineTo(x + 4, pe - 2); ctx.lineTo(x + 0.5, pe + comprimento); ctx.closePath();
    ctx.fillStyle = COR_POUSO.chama; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 1, pe - 2); ctx.lineTo(x + 2, pe - 2); ctx.lineTo(x + 0.5, pe + comprimento * 0.55); ctx.closePath();
    ctx.fillStyle = COR_POUSO.chamaMeio; ctx.fill();
  }
  retangulo({ x: x - 3, y: pe - 38, w: 7, h: 34 }, COR_POUSO.corpo, COR.apagado, 1);
  linha(COR.apagado, 1, [x - 3, pe - 22], [x + 4, pe - 22]);
  ctx.beginPath(); ctx.moveTo(x - 3, pe - 38); ctx.lineTo(x + 4, pe - 38); ctx.lineTo(x + 0.5, pe - 45); ctx.closePath();
  ctx.fillStyle = COR_POUSO.corpo; ctx.fill();
  retangulo({ x: x - 2, y: pe - 4, w: 5, h: 3 }, COR.apagado, null);
  for (const lado of [-1, 1]) {
    const ponta = trem ? [x + 0.5 + 9 * lado, pe] : [x + 0.5 + 5 * lado, pe - 3];
    linha(COR.texto, 1, [x + 0.5 + 3 * lado, pe - 12], ponta);
  }
}

function desenharPaginaPouso(agora) {
  const p = estado.pouso;
  const [scr, faltam] = estado.scr;

  // Chão e alvo
  ctx.beginPath(); ctx.ellipse(160, POUSO.chao + 92, 320, 100, 0, 0, 2 * Math.PI);
  ctx.fillStyle = COR_POUSO.chao; ctx.fill();
  for (const [rx, ry] of [[38, 8], [22, 4.5]]) {
    ctx.beginPath(); ctx.ellipse(160, POUSO.chao + 4, rx, ry, 0, 0, 2 * Math.PI);
    ctx.strokeStyle = COR_POUSO.alvo; ctx.lineWidth = 3; ctx.stroke();
  }
  circulo(160, POUSO.chao + 4, 2, COR_POUSO.alvo, null);

  // A nave, na altura do pé, e o tracejado até o alvo
  if (p.ALT !== null) {
    const metros = Math.max(0, p.ALT / 10);
    const fracao = Math.log10(1 + Math.min(metros, POUSO.altMax)) / Math.log10(1 + POUSO.altMax);
    const pe = Math.round(POUSO.chao + 4 - fracao * (POUSO.chao + 4 - POUSO.topo));
    ctx.setLineDash([4, 4]);
    linha(COR_POUSO.tracejado, 1, [160.5, pe + 4], [160.5, POUSO.chao]);
    ctx.setLineDash([]);
    naveDePouso(160, pe, p.MOTOR || 0, ["QUEIMA", "TOQUE", "POUSADA"].includes(p.FASE));
  }

  // Números em cima, como na tela do booster
  const alt = p.ALT === null ? "---" : p.ALT < 1000 ? `${(p.ALT / 10).toFixed(1)} m` : formatarDistancia(Math.round(p.ALT / 10));
  const vel = p.VV === null ? "---" : `${(Math.abs(p.VV) / 10).toFixed(1)} m/s`;
  const twr = p.TWR === null ? "---" : (p.TWR / 100).toFixed(2);
  [["ALT", alt], ["VEL", vel], ["TWR", twr]].forEach(([rotulo, valor], i) => {
    texto(rotulo, COR.rotulo, 8, 6 + i * 15);
    texto(valor, COR.verde, 44, 6 + i * 15);
  });
  const direita = [["SAS", p.SAS || "---"], ["MOTOR", p.MOTOR === null ? "---" : `${p.MOTOR}%`], ["INCL", p.INCL === null ? "---" : `${p.INCL} GR`]];
  direita.forEach(([rotulo, valor], i) => {
    texto(rotulo, COR.rotulo, 258, 6 + i * 15, "right");
    texto(valor, COR.verde, 312, 6 + i * 15, "right");
  });

  // Aviso do script, piscando
  if (p.AVISO in AVISOS_POUSO && Math.floor(agora / 500) % 2 === 0) textoCentro(AVISOS_POUSO[p.AVISO], COR.aviso, 160, 56, 11);

  // Segurando o korry: quantos segundos faltam
  caixaSegurar(scr, faltam, "PARA POUSAR");

  // Indicador da fase, embaixo à esquerda
  let fase, cor;
  if (scr in FINS_POUSO) [fase, cor] = FINS_POUSO[scr];
  else if (scr === "LIGA") [fase, cor] = ["ARMANDO", "ambar"];
  else if (p.FASE in FASES_POUSO) [fase, cor] = FASES_POUSO[p.FASE];
  else if (scr === "ATIVO" || scr === "DESL") [fase, cor] = ["LIGANDO", "azul"];
  else [fase, cor] = ["PARADO", "apagado"];
  indicadorDeFase(fase, COR[cor], 118);

  // Freada: quanto do empuxo ela precisa agora; o motor acende na marca
  const barra = { x: 212, y: 220, w: 100, h: 8 };
  texto("FREADA", COR.rotulo, 212, 204, "left", "top", 11);
  const f = p.FREADA;
  texto(f === null ? "---" : f < 999 ? `${f}%` : "> 100%", f !== null && f > 100 ? COR.aviso : COR.texto, 312, 202, "right");
  retangulo(barra, COR.aro, null);
  if (f !== null) {
    const cheia = f > 100 ? COR.aviso : p.FASE !== "QUEDA" ? COR.verde : COR.azul;
    retangulo({ x: barra.x, y: barra.y, w: Math.round(barra.w * Math.min(f, 100) / 100), h: barra.h }, cheia, null);
  }
  retangulo(barra, null, COR.borda, 1);
  if (p.IGN !== null) {
    const x = barra.x + Math.round(barra.w * p.IGN / 100);
    linha(COR.ambar, 2, [x, barra.y - 3], [x, barra.y + barra.h + 2]);
  }
}

function limitar(v, minimo, maximo) {
  return Math.max(minimo, Math.min(maximo, v));
}

function poligono(xy, cor) {
  ctx.beginPath();
  ctx.moveTo(xy[0][0], xy[0][1]);
  for (const [x, y] of xy.slice(1)) ctx.lineTo(x, y);
  ctx.closePath();
  ctx.fillStyle = cor;
  ctx.fill();
}

function tracado(xy, cor, largura, traco = []) {
  if (xy.length < 2) return;
  ctx.setLineDash(traco);
  linha(cor, largura, ...xy);
  ctx.setLineDash([]);
}

function comPose([x, y], [ux, uy], fator, sobe, desenho) {
  ctx.save();
  ctx.transform(-uy * fator, ux * fator, -ux * fator, -uy * fator, x, y);
  ctx.translate(0, -sobe);
  desenho((largura) => Math.max(largura, 1 / fator));
  ctx.restore();
}

function desenharKsc(chao, cima, fator) {
  comPose(chao, cima, fator, 0, (largura) => {
    poligono([[-26, 0], [-19, -5], [19, -5], [26, 0]], COR_CENA.plataforma);
    linha(COR_CENA.torre, largura(2), [-15, -5], [-15, -58]);
    linha(COR_CENA.torre, largura(2), [-10, -5], [-10, -58]);
    for (const [x0, y0, x1, y1] of BRACOS) linha(COR_CENA.torre, largura(1), [x0, y0], [x1, y1]);
    linha(COR_CENA.torre, largura(2), [-10, -42], [-4, -42]);
    linha(COR_CENA.torre, largura(1), [26, 0], [28, -26]);
    linha(COR_CENA.torre, largura(1), [34, 0], [32, -26]);
    circulo(30, -31, 6, COR_CENA.tanque, null);
    retangulo({ x: -112, y: -70, w: 56, h: 70 }, COR_CENA.vab, null);
    retangulo({ x: -114, y: -74, w: 60, h: 5 }, COR_CENA.vabTeto, null);
    retangulo({ x: -97, y: -62, w: 24, h: 62 }, COR_CENA.vabPorta, null);
    for (const y of [-48, -34, -20]) linha(COR_CENA.vabListra, largura(1), [-97, y], [-73, y]);
    retangulo({ x: -56, y: -30, w: 18, h: 30 }, COR_CENA.vabAnexo, null);
    linha(COR_CENA.vabTeto, largura(1), [-64, -74], [-64, -86]);
  });
}

function desenharFoguete(nave, eixo, fator, sobe, motor) {
  comPose(nave, eixo, fator, sobe, (largura) => {
    if (motor > 0) {
      const l = 6 + 16 * Math.min(motor, 100) / 100;
      poligono([[-3, 2], [3, 2], [0, 2 + l]], COR_POUSO.chama);
      poligono([[-1, 2], [1, 2], [0, 2 + l * 0.55]], COR_POUSO.chamaMeio);
    }
    retangulo({ x: -2, y: 0, w: 4, h: 2 }, COR.apagado, null);
    retangulo({ x: -4, y: -34, w: 8, h: 34 }, COR_POUSO.corpo, null);
    linha(COR.apagado, largura(1), [-4, -22], [4, -22]);
    poligono([[-4, -34], [4, -34], [0, -46]], COR_POUSO.corpo);
    poligono([[-4, -10], [-4, 0], [-9, 2]], COR.apagado);
    poligono([[4, -10], [4, 0], [9, 2]], COR.apagado);
  });
}

function marcaDaCena([x, y], [ux, uy], cor) {
  linha(cor, 2, [x - 4 * ux, y - 4 * uy], [x + 4 * ux, y + 4 * uy]);
}

function rotuloDaCena(t, [x, y], ux) {
  const topo = limitar(y - 5.5, CENA.topo, CENA.fundo - 11);
  if (ux >= 0) texto(t, COR.texto, x + 8, topo, "left", "top", 11);
  else texto(t, COR.texto, x - 8, topo, "right", "top", 11);
}

function desenharCenaSubida(agora) {
  const s = estado.subida;
  if (!(s.RAIO > 0)) {
    cena.modo = cena.chao = null;
    return;
  }
  const raio = limitar(s.RAIO, 1000, 1e8);
  const alvo = limitar(s.ALVO || 0, 10000, 2.5e8);
  const topo = limitar(s.TOPO || 0, 0, 1e7);
  const lido = (campo) => {
    const v = valorSuave(campo, agora);
    return v === null ? s[campo] : v;
  };
  const alt = lido("ALT") || 0;
  const apOk = s.AP !== null, peOk = s.PE !== null;
  const ap = apOk ? Math.min(lido("AP"), 9e8) : 0, pe = peOk ? Math.min(lido("PE"), 9e8) : 0;
  const nu = ((((s.ANOM === null ? 1800 : lido("ANOM")) % 3600) + 3600) % 3600) / 10;
  const ra = raio + ap, rp = Math.max(1, raio + pe);
  const conica = apOk && peOk && rp <= ra;
  const e = conica ? (ra - rp) / (ra + rp) : 0, p = conica ? 2 * ra * rp / (ra + rp) : 0;
  const raioConica = (v) => {
    const den = 1 + e * Math.cos(v * RAD);
    return den < 1e-3 ? Infinity : p / den;
  };
  const exibido = (r) => raio + CENA.exagero * (r - raio);
  let nuChao = 0;
  if (conica && rp < raio) nuChao = ra < raio ? 180 : Math.acos(limitar((p / raio - 1) / e, -1, 1)) * GRAUS;

  let pedido = MODOS_CENA[s.FASE] || "PAD";
  if (pedido === "MANTER") pedido = cena.modo || "PAD";
  if (cena.modo === null) {
    cena.modo = cena.antes = pedido;
    cena.desde = agora - CENA.zoom;
  } else if (pedido !== cena.modo) {
    cena.antes = cena.modo;
    cena.modo = pedido;
    cena.desde = agora;
  }
  if (s.FASE === "JANELA" || s.FASE === "DECOLAGEM") cena.chao = cena.chao === null ? s.ALT || 0 : Math.min(cena.chao, s.ALT || 0);
  const sobreChao = alt - (cena.chao || 0);
  const t = limitar((agora - cena.desde) / CENA.zoom, 0, 1);
  const b = t * t * t * (t * (6 * t - 15) + 10);
  const cameraDo = (modo) => {
    if (modo === "PAD") return { s: 96 / Math.max(340, CENA.exagero * limitar(sobreChao, 0, 1e6) * 1.35 + 140), gx: CENA.x, gy: 174, ref: nu };
    if (modo === "TRAJ") return { s: 84 / (CENA.exagero * alvo), gx: CENA.x, gy: 160, ref: 180 };
    const escala = 88 / (2 * 1.04 * (raio + CENA.exagero * Math.min(apOk && ap > alvo ? ap : alvo, 2.5e8)));
    return { s: escala, gx: CENA.x, gy: CENA.y - raio * escala, ref: nu };
  };
  const pesoPad = cena.modo === "PAD" ? 1 : cena.antes === "PAD" ? 1 - b : 0;
  const rdNave = exibido(raio + limitar(alt - (cena.chao || 0) * pesoPad, 0, 9e8));
  const naveNa = (c) => {
    const phi = (90 + c.ref - nu) * RAD;
    return [c.gx + rdNave * Math.cos(phi) * c.s, c.gy - (rdNave * Math.sin(phi) - raio) * c.s];
  };
  let cam = cameraDo(cena.modo);
  if (cena.antes !== cena.modo && b < 1) {
    const c0 = cameraDo(cena.antes);
    const p0 = naveNa(c0), p1 = naveNa(cam);
    const meio = {
      s: Math.exp(Math.log(c0.s) + (Math.log(cam.s) - Math.log(c0.s)) * b),
      gx: 0, gy: 0,
      ref: c0.ref + (cam.ref - c0.ref) * b,
    };
    const q = naveNa(meio);
    meio.gx = p0[0] + (p1[0] - p0[0]) * b - q[0];
    meio.gy = p0[1] + (p1[1] - p0[1]) * b - q[1];
    cam = meio;
  }
  const pesoTraj = cena.modo === "TRAJ" ? (cena.antes === "TRAJ" ? 1 : b) : cena.antes === "TRAJ" ? 1 - b : 0;
  const pesoOrb = cena.modo === "ORB" ? (cena.antes === "ORB" ? 1 : b) : cena.antes === "ORB" ? 1 - b : 0;
  const voo = 1 - pesoPad;
  const comAlfa = (alfa, desenho) => {
    if (alfa <= 0.01) return;
    ctx.globalAlpha = alfa;
    desenho();
    ctx.globalAlpha = 1;
  };

  const tela = (rd, phi) => [
    cam.gx + limitar(rd * Math.cos(phi * RAD) * cam.s, -CENA.limite, CENA.limite),
    cam.gy - limitar((rd * Math.sin(phi * RAD) - raio) * cam.s, -CENA.limite, CENA.limite),
  ];
  const fora = (phi) => [Math.cos(phi * RAD), -Math.sin(phi * RAD)];
  const angulo = (v) => 90 + cam.ref - v;
  const longe = ([x, y]) => Math.abs(x - CENA.x) > CENA.longe || Math.abs(y - CENA.y) > CENA.longe;
  const cx = cam.gx;
  const arco = (de, ate, pontos) => {
    const xy = [];
    for (let k = 0; k <= pontos; k++) {
      const v = de + (ate - de) * k / pontos;
      const rd = exibido(raioConica(v));
      if (isFinite(rd) && rd >= 0.6 * raio) xy.push(tela(rd, angulo(v)));
    }
    return xy;
  };
  const naSuperficie = (phi, fracao) => tela(raio * fracao, phi);
  const cy = cam.gy + raio * cam.s;
  const rPlaneta = raio * cam.s;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, CENA.topo, LARGURA, CENA.fundo - CENA.topo + 1);
  ctx.clip();
  for (const [x, y] of ESTRELAS) circulo(x, y, 0.8, COR_CENA.estrela, null);
  if (topo > 0) circulo(cx, cy, exibido(raio + topo) * cam.s, COR_CENA.ceu, null);
  comAlfa(voo, () => {
    ctx.setLineDash([3, 4]);
    circulo(cx, cy, exibido(raio + alvo) * cam.s, null, COR.ambar, 1);
    ctx.setLineDash([]);
  });
  if (conica) {
    comAlfa(voo * pesoOrb, () => tracado(arco(0, 360, 96), COR.verde, 2));
    comAlfa(voo * (1 - pesoOrb), () => {
      const de = nuChao > 0 ? nuChao - 2 : 0, ate = nuChao > 0 ? 360 - nuChao + 2 : 360;
      const v = limitar(nu, de, ate);
      tracado(arco(v, ate, 60), COR.traco, 1, [4, 3]);
      tracado(arco(de, v, 40), COR.verde, 2);
    });
  }

  const corpo = s.CORPO;
  circulo(cx, cy, rPlaneta, { KERBIN: COR_CENA.mar, MUN: COR_CENA.mun, MINMUS: COR_CENA.minmus }[corpo] || COR_CENA.outro, null);
  if (corpo === "KERBIN") {
    for (const [leste, oeste, dentro] of CONTINENTES) {
      ctx.beginPath();
      ctx.arc(cx, cy, rPlaneta, -leste * RAD, -oeste * RAD, true);
      for (const [phi, f] of dentro) ctx.lineTo(...naSuperficie(phi, f));
      ctx.closePath();
      ctx.fillStyle = COR_CENA.terra;
      ctx.fill();
    }
    for (const [phi, f, r] of ILHAS) circulo(...naSuperficie(phi, f), rPlaneta * r, COR_CENA.terra, null);
    poligono(GELO.map((f, i) => naSuperficie(i * 30, f)), COR_CENA.gelo);
  } else if (corpo === "MUN") {
    for (const mar of MARES_MUN) poligono(mar.map(([phi, f]) => naSuperficie(phi, f)), COR_CENA.manchaMun);
    for (const [phi, f, r] of CRATERAS_MUN) circulo(...naSuperficie(phi, f), rPlaneta * r, null, COR_CENA.manchaMun, 1);
  } else if (corpo === "MINMUS") {
    for (const [phi, f, r] of PLANOS_MINMUS) circulo(...naSuperficie(phi, f), rPlaneta * r, COR_CENA.manchaMinmus, null);
  }

  const phiNave = angulo(nu);
  const nave = tela(rdNave, phiNave);
  const chao = tela(raio, phiNave);
  const cima = fora(phiNave);
  let tangente = [-cima[1], cima[0]];
  if (conica) {
    const a = tela(exibido(raioConica(nu - 0.5)), phiNave + 0.5);
    const d = tela(exibido(raioConica(nu + 0.5)), phiNave - 0.5);
    const n = Math.hypot(d[0] - a[0], d[1] - a[1]);
    if (n > 0 && isFinite(n)) tangente = [(d[0] - a[0]) / n, (d[1] - a[1]) / n];
  }
  const ex = tangente[0] * (1 - pesoPad) + cima[0] * pesoPad, ey = tangente[1] * (1 - pesoPad) + cima[1] * pesoPad;
  const ne = Math.hypot(ex, ey);
  const eixo = ne > 0 ? [ex / ne, ey / ne] : [0, -1];
  const fator = 3 * cam.s;

  if (corpo === "KERBIN" && fator >= 11 / 256 && !longe(chao)) comAlfa(pesoPad, () => desenharKsc(chao, cima, fator));

  if (conica) {
    const pAp = tela(exibido(ra), angulo(180)), uAp = fora(angulo(180));
    if (!longe(pAp)) {
      const t = `AP ${formatarDistancia(s.AP)}`;
      comAlfa(voo, () => marcaDaCena(pAp, uAp, COR.ambar));
      comAlfa(voo * pesoOrb, () => rotuloDaCena(t, pAp, uAp[0]));
      comAlfa(voo * (1 - pesoOrb), () => textoCentro(t, COR.texto, pAp[0], pAp[1] - 17.5 < CENA.topo ? pAp[1] + 13 : pAp[1] - 12, 11));
    }
    const pPe = tela(exibido(rp), angulo(0)), uPe = fora(angulo(0));
    if (pe > 0 && !longe(pPe)) {
      comAlfa(voo * pesoOrb, () => {
        marcaDaCena(pPe, uPe, COR.rotulo);
        rotuloDaCena(`PE ${formatarDistancia(s.PE)}`, pPe, uPe[0]);
      });
    }
  }
  const rAlvo = exibido(raio + alvo) * cam.s, dx = 296 - cx;
  if (rAlvo > Math.abs(dx)) comAlfa(pesoTraj, () => texto(`ALVO ${formatarDistancia(alvo)}`, COR.ambar, 304, cy - Math.sqrt(rAlvo * rAlvo - dx * dx) - 4, "right", "bottom", 11));

  if (!longe(nave)) desenharFoguete(nave, eixo, limitar(fator, 83 / 256, 2), 5 * pesoPad, s.MOTOR || 0);
  ctx.restore();
}

function subidaVoando() {
  const scr = estado.lancar[0];
  if (scr === "ATIVO" || scr === "DESL") return true;
  return scr in FINS_SUBIDA && CAMPOS_SUBIDA.some((c) => estado.subida[c] !== null);
}

function valorMenuSubida(nome) {
  const m = estado.menuSubida;
  if (nome === "INC" && m.PLANO) return "DO ALVO";
  if (m[nome] === null) return "---";
  if (nome === "ALT") return `${m[nome]} KM`;
  if (nome === "INC") return `${m[nome]} GR`;
  return m[nome] ? "SIM" : "NAO";
}

function desenharConfiguracaoSubida() {
  textoCentro("SUBIDA ATE A ORBITA", COR.rotulo, 160, 12, 14);
  linha(COR.borda, 1, [12, 24], [308, 24]);
  const [linhaCursor, escolhida] = estado.cursorSubida;
  LINHAS_MENU_SUBIDA.forEach((nome, i) => {
    const y = 46 + i * 44;
    const noCursor = nome === linhaCursor;
    if (noCursor) cursorDaLinha(y, escolhida);

    texto(valorMenuSubida(nome), noCursor && escolhida ? COR.ambar : COR.texto, 300, y, "right", "middle", 20);
  });
  linha(COR.borda, 1, [12, 184], [308, 184]);
  const [resultado, cor] = FINS_SUBIDA[estado.lancar[0]] || ["PRONTO", "texto"];
  texto(resultado, COR[cor], 16, 192);

}

function grausSubida(v) {
  return v === null ? "---" : (v / 10).toFixed(1);
}

function desenharVooSubida(agora) {
  const s = estado.subida;
  desenharCenaSubida(agora);
  [
    ["ALT", formatarDistancia(s.ALT)],
    ["VEL", formatarVelocidade(s.VEL)],
    ["Q", s.Q === null ? "---" : `${(s.Q / 1000).toFixed(1)} kPa`],
    ["DV", s.DV === null ? "---" : `${s.DV} m/s`],
  ].forEach(([rotulo, valor], i) => {
    texto(rotulo, COR.rotulo, 8, 6 + i * 15);
    texto(valor, COR.verde, 44, 6 + i * 15);
  });
  const inc = s.INC === null && s.INCA === null ? "---" : `${grausSubida(s.INC)}/${grausSubida(s.INCA)}`;
  [["AP", formatarDistancia(s.AP)], ["PE", formatarDistancia(s.PE)], ["INC", inc]].forEach(([rotulo, valor], i) => {
    texto(rotulo, COR.rotulo, 176, 6 + i * 15);
    texto(valor, COR.verde, 312, 6 + i * 15, "right");
  });
  if (s.AVISO in AVISOS_SUBIDA && Math.floor(agora / 500) % 2 === 0) textoCentro(AVISOS_SUBIDA[s.AVISO], COR.aviso, 160, 68, 11);

  const scr = estado.lancar[0];
  let fase, cor;
  if (scr in FINS_SUBIDA) [fase, cor] = FINS_SUBIDA[scr];
  else if (s.FASE in FASES_SUBIDA) [fase, cor] = [s.FASE, FASES_SUBIDA[s.FASE]];
  else [fase, cor] = ["LIGANDO", "azul"];
  indicadorDeFase(fase, COR[cor], 140);
  let baixo = "";
  if (s.FASE === "JANELA" && s.JAN !== null) baixo = formatarTempo(s.JAN);
  else if ((s.FASE === "GIRO" || s.FASE === "CURVA") && s.GIRO !== null) baixo = `GIRO ${grausSubida(s.GIRO)} GR`;
  else if (s.MOTOR !== null) baixo = `MOTOR ${s.MOTOR}%`;
  texto(baixo, COR.texto, 48, 225, "left", "top", 11);
}

function desenharPaginaSubida(agora) {
  if (subidaVoando()) desenharVooSubida(agora);
  else desenharConfiguracaoSubida();
  caixaSegurar(estado.lancar[0], estado.lancar[1], "PARA LANCAR");
}

function desenhar(agora) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COR.fundo;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * escala, 0, 0, dpr * escala, dpr * deslocX, dpr * deslocY);

  const comSinal = agora - estado.ultimaValida < SEM_SINAL;
  if (comSinal && estado.pagina === "SAS") { desenharPaginaSas(); return; }
  if (comSinal && estado.pagina === "AP") { desenharPaginaAp(); return; }
  if (comSinal && estado.pagina === "POUSO") { desenharPaginaPouso(agora); return; }
  if (comSinal && estado.pagina === "SUBIDA") { desenharPaginaSubida(agora); return; }
  desenharAro();
  desenharNavball(comSinal);
  desenharCaixas(comSinal, agora);
  desenharBarras(comSinal);
  desenharBotoes(comSinal, agora);
  desenharPainel(comSinal);
}

// ---------- tamanho, toque e laço de desenho ----------

function redimensionar() {
  dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = `${w}px`;
  canvas.style.height = `${h}px`;
  // O layout de 320x240 ocupa o máximo possível, sem distorcer.
  escala = Math.min(w / LARGURA, h / ALTURA);
  deslocX = (w - LARGURA * escala) / 2;
  deslocY = (h - ALTURA * escala) / 2;
  prepararBola(Math.round(2 * BOLA.r * escala * dpr));
}

function telaCheia() {
  const el = document.documentElement;
  if (document.fullscreenElement || !el.requestFullscreen) return;
  el.requestFullscreen()
    .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape"))
    .catch(() => {});
}

// ---------- alarme sonoro ----------

// ESTOL: dois bipes agudos por segundo enquanto o alpha floor do FBW estiver
// ligado. O navegador só deixa tocar som depois de um toque na página, então
// o primeiro toque (o mesmo da tela cheia) liga o som.
const ALARME = { hz: 880, bipe: 0.12, vao: 0.08, repete: 1000 };
let audio = null;

function liberarSom() {
  if (audio) return;
  const Contexto = window.AudioContext || window.webkitAudioContext;
  if (Contexto) audio = new Contexto();
}

function bipe(quando) {
  const osc = audio.createOscillator(), volume = audio.createGain();
  osc.type = "square";
  osc.frequency.value = ALARME.hz;
  volume.gain.value = 0.15;
  osc.connect(volume).connect(audio.destination);
  osc.start(quando);
  osc.stop(quando + ALARME.bipe);
}

setInterval(() => {
  const comSinal = performance.now() - estado.ultimaValida < SEM_SINAL;
  if (!audio || !estado.estol || !comSinal) return;
  const agora = audio.currentTime;
  bipe(agora);
  bipe(agora + ALARME.bipe + ALARME.vao);
}, ALARME.repete);

function tocar(nome) {
  estado.toque = [nome, performance.now()];
  mandar(`TOQUE ${nome}`);
}

canvas.addEventListener("pointerdown", (e) => {
  telaCheia();   // o primeiro toque põe em tela cheia, onde o navegador deixa
  liberarSom();  // e libera o alarme sonoro
  if (estado.pagina !== "NAV") return;   // as páginas do painel são só para ver
  const x = (e.clientX - deslocX) / escala, y = (e.clientY - deslocY) / escala;
  for (const [nome, [cx, cy]] of Object.entries(BOTOES_REDONDOS)) {
    if ((x - cx) ** 2 + (y - cy) ** 2 <= RAIO_BOTAO ** 2) { tocar(nome); return; }
  }
  const r = CAIXA_VEL;
  if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) tocar("MODO");
});

window.addEventListener("resize", redimensionar);
redimensionar();

let ultimoQuadro = 0;
function quadro(agora) {
  if (agora - ultimoQuadro >= INTERVALO_QUADRO - 1) {
    ultimoQuadro = agora;
    desenhar(agora);
  }
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
</script>
